<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | YourBrand</title>
  <meta name="description" content="Create a free account.">

  <!-- Fonts: Fraunces (headings) + DM Sans (body). Both open source (SIL OFL). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

  <!-- Template theme -->
  <link href="assets/css/style.min.css" rel="stylesheet">
</head>
<body>

<a class="visually-hidden-focusable" href="#main">Skip to content</a>

<main id="main">
  <div class="auth-layout">
    <div class="auth-media">
      <img src="assets/img/hero/hero-1.svg" alt="">
      <a class="site-logo" href="index.html"><span class="site-logo-mark"><svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg></span>YourBrand</a>
      <figure class="m-0"><blockquote>&ldquo;Listing our flat was simple, and the offers came fast.&rdquo;</blockquote><figcaption>Priya S., sold an apartment</figcaption></figure>
    </div>
    <div class="auth-panel">
      <div class="auth-top d-lg-none"><a class="site-logo" href="index.html"><span class="site-logo-mark"><svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg></span>YourBrand</a></div>
      <div class="auth-card">
        <h1>Create your account</h1>
        <p>It takes a minute. No card needed.</p>
        <form class="auth-form" onsubmit="return false">
          <div class="row g-3">
            <div class="col-sm-6"><label for="rFirst" class="form-label">First name</label><input type="text" class="form-control" id="rFirst" autocomplete="given-name"></div>
            <div class="col-sm-6"><label for="rLast" class="form-label">Last name</label><input type="text" class="form-control" id="rLast" autocomplete="family-name"></div>
          </div>
          <div><label for="rEmail" class="form-label">Email</label><input type="email" class="form-control" id="rEmail" autocomplete="email" placeholder="you@example.com"></div>
          <div><label for="rRole" class="form-label">I am a</label><select class="form-select" id="rRole"><option>Buyer or renter</option><option>Seller or landlord</option><option>Agent</option></select></div>
          <div>
            <label for="rPass" class="form-label">Password</label>
            <div class="password-field">
              <input type="password" class="form-control" id="rPass" autocomplete="current-password" placeholder="At least 8 characters" aria-describedby="rPass-help">
              <button type="button" class="btn btn-ghost btn-icon btn-sm" data-toggle-password="#rPass" aria-pressed="false" aria-label="Show password"><svg class="icon" aria-hidden="true"><use href="#i-eye"></use></svg></button>
            </div>
            <div id="rPass-help" class="form-text">Use at least 8 characters with a number.</div>
          </div>
          <div class="form-check"><input class="form-check-input" type="checkbox" id="rTerms"><label class="form-check-label" for="rTerms">I agree to the <a href="terms.html">terms</a> and <a href="privacy.html">privacy policy</a></label></div>
          <button type="submit" class="btn btn-primary btn-lg">Create account</button>
        </form>
        <p class="auth-foot">Already have an account? <a href="login.html" class="fw-semibold">Sign in</a></p>
      </div>
    </div>
  </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
